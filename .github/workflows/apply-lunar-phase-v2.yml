name: Integrar fase lunar real y signo zodiacal

on:
  push:
    paths:
      - '.github/scripts/patch_lunar_phase_v2.py'
      - '.github/workflows/apply-lunar-phase-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar mejoras lunares
        run: python .github/scripts/patch_lunar_phase_v2.py
      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add luna.html index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Sincroniza fase lunar real y signo zodiacal"
            git push origin main
          fi
