name: Integrar módulo Luna

on:
  push:
    paths:
      - '.github/workflows/apply-luna-route.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Conectar Luna con su módulo
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_moon = '<button class="planet moon nav" data-index="3" data-name="Luna" data-action="Fases y revolución lunar · Próximamente" data-view="soon" aria-label="Luna"><span class="surface"></span></button>'
          new_moon = '<button class="planet moon nav" data-index="3" data-name="Luna" data-action="Fases · lunaciones · revolución lunar" data-view="luna" aria-label="Luna: fases, lunaciones y revolución lunar"><span class="surface"></span></button>'
          if old_moon in s:
              s = s.replace(old_moon, new_moon, 1)
          elif 'data-name="Luna"' in s and 'data-view="luna"' not in s:
              raise SystemExit('La Luna existe, pero no coincide con el patrón esperado')

          old_activate = "function activate(el){const view=el.dataset.view,name=el.dataset.name||'Astro';if(view==='soon'){"
          new_activate = "function activate(el){const view=el.dataset.view,name=el.dataset.name||'Astro';if(view==='luna'){location.href='./luna.html';return}if(view==='soon'){"
          if "view==='luna'" not in s:
              if old_activate not in s:
                  raise SystemExit('No se encontró activate()')
              s = s.replace(old_activate, new_activate, 1)

          # Si una herramienta interna llega con ?view=natal, puede abrirse directamente.
          if 'directViewBoot' not in s:
              marker = '\n</script>\n</body></html>'
              boot = "\n// directViewBoot\nconst directView=new URLSearchParams(location.search).get('view');if(['orbitas','rueda','natal'].includes(directView)){const directName={orbitas:'Sol',rueda:'Zodiaco',natal:'Tierra'}[directView];setTimeout(()=>start(directView,directName),70)}\n"
              if marker not in s:
                  raise SystemExit('No se encontró el cierre del script de portada')
              s = s.replace(marker, boot + marker, 1)

          # En la revolución lunar, la página Luna guarda los datos del retorno y abre
          # Carta natal con ?auto=1. Al cargar, se levanta automáticamente esa carta.
          needle = "if(${JSON.stringify(selectedView)}==='natal'){const v=document.getElementById('velo');if(v&&!document.querySelector('#cartaPanel.abierto'))v.classList.add('visible')}"
          replacement = needle + ";if(${JSON.stringify(selectedView)}==='natal'&&new URLSearchParams(location.search).get('auto')==='1'){setTimeout(()=>document.getElementById('natalForm')?.requestSubmit(),180)}"
          if "get('auto')==='1'" not in s:
              if needle not in s:
                  raise SystemExit('No se encontró el arranque de la vista natal')
              s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding='utf-8')

      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Conecta la Luna con su módulo de lunaciones"
            git push origin main
          fi
