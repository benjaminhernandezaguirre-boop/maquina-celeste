name: Integrar ilustraciones zodiacales lunares V2

on:
  push:
    paths:
      - '.github/workflows/apply-lunar-zodiac-visuals-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Crear módulo visual de los 12 signos
        shell: bash
        run: |
          mkdir -p app
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          data=''
          Path('app/lunar-zodiac-v2.js').write_bytes(gzip.decompress(base64.b64decode(data)))
          p=Path('luna.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="app/lunar-zodiac-v2.js?v=2"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('No se encontró </body> en luna.html')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          print('Módulo visual zodiacal V2 conectado')
          PY
      - name: Verificar integración
        run: |
          test -f app/lunar-zodiac-v2.js
          grep -q "'Aries'" app/lunar-zodiac-v2.js
          grep -q "'Piscis'" app/lunar-zodiac-v2.js
          grep -q 'lunar-zodiac-v2.js' luna.html
      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lunar-zodiac-v2.js luna.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Añade ilustraciones y sellos dinámicos para los 12 signos lunares"
            git push origin main
          fi
