name: Apply staged Astroplanetario update

on:
  push:
    branches:
      - astro-update-20260909
    paths:
      - ".github/workflows/apply-staged-astro-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astro-update-20260909
          fetch-depth: 0

      - name: Reconstruct and verify uploaded package
        shell: bash
        run: |
          set -euo pipefail
          cat _astro_update/package.part* > /tmp/package.b64
          base64 -d /tmp/package.b64 > /tmp/astroplanetario-cambios.zip
          echo "28187d990e4116f76599da96ec282ea6ba0ada599c1417bd136b0311bda80d50  /tmp/astroplanetario-cambios.zip" | sha256sum -c -
          unzip -t /tmp/astroplanetario-cambios.zip
          mkdir -p /tmp/astro
          unzip -o /tmp/astroplanetario-cambios.zip -d /tmp/astro

      - name: Apply only intended files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/astro/astroplanetario.html ./astroplanetario.html
          cp /tmp/astro/index.html ./index.html
          cp /tmp/astro/CAMBIOS.md ./CAMBIOS.md
          mkdir -p app scripts
          cp /tmp/astro/app/natal-theme.js ./app/natal-theme.js
          cp /tmp/astro/app/orbit-theme.js ./app/orbit-theme.js
          cp /tmp/astro/app/zodiac-theme.js ./app/zodiac-theme.js
          cp /tmp/astro/scripts/partir.py ./scripts/partir.py
          cp /tmp/astro/vercel.json ./vercel.json
          rm -rf _astro_update

      - name: Commit update to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integra nueva versión de Astroplanetario"
          git push origin astro-update-20260909

# retry after correcting staged package part 00
