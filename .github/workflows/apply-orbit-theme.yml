name: Integrar tema de Órbitas

on:
  push:
    paths:
      - '.github/workflows/apply-orbit-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrar Órbitas V1 cinematográficas
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          css = Path('app/orbit-theme.css')
          js = Path('app/orbit-theme.js')
          if not css.exists() or not js.exists():
              raise SystemExit('Faltan los recursos del tema de órbitas')

          p0 = Path('app/part-00.txt')
          t0 = p0.read_text(encoding='utf-8')
          marker = '<script src="app/zodiac-theme.js" defer></script>'
          addition = marker + '\n<link rel="stylesheet" href="app/orbit-theme.css">\n<script src="app/orbit-theme.js" defer></script>'
          if 'app/orbit-theme.css' not in t0:
              if marker not in t0:
                  raise SystemExit('No se encontró el punto de inserción en part-00')
              t0 = t0.replace(marker, addition, 1)
          p0.write_text(t0, encoding='utf-8')

          p3 = Path('app/part-03.txt')
          t3 = p3.read_text(encoding='utf-8')

          zodiac_toggle = '  document.getElementById("app").classList.toggle("zodiac", v==="rueda");'
          orbit_toggle = zodiac_toggle + '\n  document.getElementById("app").classList.toggle("orbits", v==="orbitas");'
          if 'classList.toggle("orbits"' not in t3:
              if zodiac_toggle not in t3:
                  raise SystemExit('No se encontró el cambio de vista para añadir la clase orbits')
              t3 = t3.replace(zodiac_toggle, orbit_toggle, 1)

          helper_marker = 'function mezcla(hex, hex2, k){'
          helper = dedent('''
            function planetaCinematico(x,y,r,color,sunX,sunY,activo=false){
              esfera(x,y,r,color,activo?1.22:.88);
              const dx=sunX-x, dy=sunY-y, len=Math.max(1,Math.hypot(dx,dy));
              const ux=dx/len, uy=dy/len;
              ctx.save();
              ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
              const sombra=ctx.createLinearGradient(x+ux*r*1.08,y+uy*r*1.08,x-ux*r*1.08,y-uy*r*1.08);
              sombra.addColorStop(0,'rgba(0,0,0,0)');
              sombra.addColorStop(.48,'rgba(0,0,0,.06)');
              sombra.addColorStop(.76,'rgba(0,0,0,.34)');
              sombra.addColorStop(1,'rgba(0,0,0,.76)');
              ctx.fillStyle=sombra; ctx.fillRect(x-r-2,y-r-2,r*2+4,r*2+4);
              const luz=ctx.createRadialGradient(x+ux*r*.46,y+uy*r*.46,r*.03,x+ux*r*.18,y+uy*r*.18,r*1.1);
              luz.addColorStop(0,'rgba(255,248,224,.19)'); luz.addColorStop(.36,'rgba(255,240,205,.045)'); luz.addColorStop(1,'rgba(255,255,255,0)');
              ctx.fillStyle=luz; ctx.fillRect(x-r-2,y-r-2,r*2+4,r*2+4);
              ctx.restore();
              ctx.strokeStyle=activo ? color+'A0' : 'rgba(230,226,216,.11)';
              ctx.lineWidth=activo?1.35:.75; ctx.beginPath(); ctx.arc(x,y,r+.6,0,7); ctx.stroke();
            }
          ''').lstrip()
          if 'function planetaCinematico' not in t3:
              if helper_marker not in t3:
                  raise SystemExit('No se encontró el punto para insertar el sombreado planetario')
              t3 = t3.replace(helper_marker, helper + helper_marker, 1)

          t3 = t3.replace(
              'const k = Math.min(W,H)/2 * 0.91 * zoom / COMP_MAX;',
              'const k = Math.min(W,H)/2 * 0.955 * zoom / COMP_MAX;',
              1
          )

          halo_marker = '  ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);\n\n  // Órbitas: usamos x/y/z reales de los elementos orbitales y las proyectamos con perspectiva.'
          halo_add = dedent('''
              ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);

              // Ejes de referencia de la eclíptica: guía visual, no modifica la geometría orbital.
              const ex1=proyOrbital(41,0,0,k), ex2=proyOrbital(-41,0,0,k);
              const ey1=proyOrbital(0,41,0,k), ey2=proyOrbital(0,-41,0,k);
              ctx.save(); ctx.setLineDash([2,8]); ctx.lineWidth=.7;
              ctx.strokeStyle='rgba(218,184,110,.075)';
              ctx.beginPath(); ctx.moveTo(cx+ex1[0],cy-ex1[1]); ctx.lineTo(cx+ex2[0],cy-ex2[1]); ctx.stroke();
              ctx.strokeStyle='rgba(151,165,202,.055)';
              ctx.beginPath(); ctx.moveTo(cx+ey1[0],cy-ey1[1]); ctx.lineTo(cx+ey2[0],cy-ey2[1]); ctx.stroke();
              ctx.restore();

              // Órbitas: usamos x/y/z reales de los elementos orbitales y las proyectamos con perspectiva.
          ''').rstrip()
          if 'Ejes de referencia de la eclíptica' not in t3:
              if halo_marker not in t3:
                  raise SystemExit('No se encontró el halo orbital para añadir los ejes')
              t3 = t3.replace(halo_marker, halo_add, 1)

          sun_old = dedent('''
              ctx.strokeStyle="#E3BE7544"; ctx.lineWidth=1;
              ctx.beginPath(); ctx.arc(cx,cy,porId.sol.radio*2.35,0,7); ctx.stroke();
          ''').strip()
          sun_new = dedent('''
              ctx.save();
              for(const [m,a] of [[2.15,.30],[2.8,.15],[3.6,.07]]){
                ctx.strokeStyle=`rgba(227,190,117,${a})`; ctx.lineWidth=m<2.5?1:.7;
                ctx.beginPath(); ctx.arc(cx,cy,porId.sol.radio*m,0,7); ctx.stroke();
              }
              ctx.setLineDash([2,6]); ctx.strokeStyle='rgba(255,224,154,.12)';
              ctx.beginPath(); ctx.arc(cx,cy,porId.sol.radio*4.25,0,7); ctx.stroke();
              ctx.restore();
          ''').strip()
          if sun_old in t3:
              t3 = t3.replace(sun_old, sun_new, 1)

          t3 = t3.replace(
              'const rr = a.radio*profundidad*(act?1.12:1);',
              'const rr = a.radio*profundidad*(act?1.18:1);',
              1
          )
          t3 = t3.replace(
              '    esfera(x, y, rr, a.color, act?1.30:.92);',
              '    planetaCinematico(x, y, rr, a.color, cx, cy, act);',
              1
          )
          t3 = t3.replace(
              '      esfera(lx, ly, 4*profundidad, porId.luna.color, .82);',
              '      planetaCinematico(lx, ly, 4*profundidad, porId.luna.color, cx, cy, false);',
              1
          )

          p3.write_text(t3, encoding='utf-8')

      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/part-00.txt app/part-03.txt
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Integra Órbitas V1 con pulido cinematográfico"
            git push origin main
          fi
