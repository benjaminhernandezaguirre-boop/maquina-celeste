name: Integrar navegación temporal de Órbitas

on:
  push:
    paths:
      - '.github/workflows/apply-orbit-time-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Añadir pasado, fecha exacta y carta del momento
        run: python scripts/apply_orbit_time.py

      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/part-00.txt app/part-01.txt app/part-02.txt app/orbit-theme.js
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Añade viaje temporal y carta astral desde Órbitas"
            git push origin main
          fi
