name: Integrar tema de Rueda Zodiacal

on:
  push:
    paths:
      - '.github/workflows/apply-zodiac-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrar Rueda Zodiacal V1
        shell: python
        run: |
          from pathlib import Path

          css = Path('app/zodiac-theme.css')
          js = Path('app/zodiac-theme.js')
          if not css.exists() or not js.exists():
              raise SystemExit('Faltan los recursos del tema zodiacal')

          # 1) Cargar tema visual e identidad.
          p = Path('app/part-00.txt')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="app/natal-theme.js" defer></script>'
          addition = marker + '\n<link rel="stylesheet" href="app/zodiac-theme.css">\n<script src="app/zodiac-theme.js" defer></script>'
          if 'app/zodiac-theme.css' not in text:
              if marker not in text:
                  raise SystemExit('No se encontró el punto de inserción en part-00')
              text = text.replace(marker, addition, 1)
          p.write_text(text, encoding='utf-8')

          # 2) Normalizar la vista para que Rueda quede realmente seleccionada.
          p3 = Path('app/part-03.txt')
          t3 = p3.read_text(encoding='utf-8')
          old = 'function cambiaVista(v){\n  vista = v; zoom = 1;'
          new = 'function cambiaVista(v){\n  if(v === "zodiaco") v = "rueda";\n  vista = v; zoom = 1;'
          if old in t3 and 'if(v === "zodiaco") v = "rueda";' not in t3:
              t3 = t3.replace(old, new, 1)
          old2 = '  document.getElementById("app").classList.toggle("natal", v==="natal");'
          new2 = old2 + '\n  document.getElementById("app").classList.toggle("zodiac", v==="rueda");'
          if old2 in t3 and 'classList.toggle("zodiac"' not in t3:
              t3 = t3.replace(old2, new2, 1)
          p3.write_text(t3, encoding='utf-8')

          # 3) El anillo de la portada debe abrir la vista interna correcta.
          idx = Path('index.html')
          ti = idx.read_text(encoding='utf-8')
          ti = ti.replace('data-view="zodiaco" data-name="Zodiaco"', 'data-view="rueda" data-name="Zodiaco"')
          idx.write_text(ti, encoding='utf-8')

      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/part-00.txt app/part-03.txt index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Integra Rueda Zodiacal V1 con Astroplanetario"
            git push origin main
          fi
