name: Apply staged Saturno update

on:
  push:
    branches:
      - saturno-update-20260909
    paths:
      - ".github/workflows/apply-saturno-staged-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturno-update-20260909
          fetch-depth: 0

      - name: Reconstruct and verify uploaded package
        shell: bash
        run: |
          set -euo pipefail
          cat _saturno_stage/package.part* > /tmp/package.b64
          base64 -d /tmp/package.b64 > /tmp/saturno-linea-de-vida.zip
          echo "0f444169ae4fde5600ba42e80815f42f668f0fe419aef706488ed8ccf78c57ed  /tmp/saturno-linea-de-vida.zip" | sha256sum -c -
          unzip -t /tmp/saturno-linea-de-vida.zip
          rm -rf /tmp/saturno
          mkdir -p /tmp/saturno
          unzip -o /tmp/saturno-linea-de-vida.zip -d /tmp/saturno

      - name: Apply Saturno safely
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/saturno/saturno.html ./saturno.html
          mkdir -p app
          cp /tmp/saturno/app/efemerides.js ./app/efemerides.js
          cp /tmp/saturno/NOTA-SATURNO.md ./NOTA-SATURNO.md

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="planet saturn nav" data-index="6" data-name="Saturno" data-action="Herramientas de Saturno · Próximamente" data-view="soon" aria-label="Saturno"><span class="surface"></span></button>'
          new = '<button class="planet saturn nav" data-index="6" data-name="Saturno" data-action="Línea de vida · retornos y ciclos" data-view="saturno" aria-label="Saturno: línea de vida"><span class="surface"></span></button>'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('No encontré el botón esperado de Saturno')

          luna = "if(view==='luna'){location.href='./luna.html?v=lunar-phase-v2-20260909';return}"
          sat = "if(view==='saturno'){location.href='./saturno.html';return}"
          if sat not in s:
              if luna not in s:
                  raise SystemExit('No encontré el punto esperado en activate()')
              s = s.replace(luna, luna + sat, 1)

          # Esta actualización no incluye mercurio.html. Mantener Mercurio como Próximamente.
          s = s.replace('data-name="Mercurio" data-action="Retrogradaciones · sombras · calendario" data-view="mercurio"', 'data-name="Mercurio" data-action="Herramientas de Mercurio · Próximamente" data-view="soon"')
          s = s.replace("if(view==='mercurio'){location.href='./mercurio.html';return}", '')
          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('vercel.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          headers = d.setdefault('headers', [])
          # No añadir mercurio.html porque no forma parte del paquete recibido.
          headers = [h for h in headers if h.get('source') != '/mercurio.html']
          sources = {h.get('source') for h in headers}
          def no_cache(src):
              return {'source': src, 'headers': [{'key': 'Cache-Control', 'value': 'no-cache, no-store, must-revalidate'}]}
          additions = []
          for src in ('/saturno.html', '/app/efemerides.js'):
              if src not in sources:
                  additions.append(no_cache(src))
          d['headers'] = additions + headers
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf _saturno_stage
          rm -f .github/workflows/apply-saturno-staged-update.yml

      - name: Commit update to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integra línea de vida de Saturno"
          git push origin saturno-update-20260909
