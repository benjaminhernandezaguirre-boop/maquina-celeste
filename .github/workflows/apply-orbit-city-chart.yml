name: Integrar ciudad y carta del momento

on:
  push:
    paths:
      - '.github/workflows/apply-orbit-city-chart.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar integración
        run: python .github/scripts/patch_orbit_city.py
      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/part-01.txt app/part-02.txt app/orbit-time.css
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Conecta ciudad con la carta astral del instante"
            git push origin main
          fi
