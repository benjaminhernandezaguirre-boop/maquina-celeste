name: Integrar Luna progresada V2

on:
  push:
    paths:
      - '.github/workflows/apply-luna-progressed-v2.yml'
      - '.github/scripts/patch_luna_progressed_v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar parche
        run: python .github/scripts/patch_luna_progressed_v2.py
      - name: Guardar cambios
        run: |
          git config user.name "Astroplanetario Bot"
          git config user.email "actions@users.noreply.github.com"
          git add moon.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Corrige Luna progresada con hora y ciudad natal"
            git push origin main
          fi
